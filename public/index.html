<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#13102a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Oroscopo del Giorno</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;700&family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <div class="ptr" id="ptr" aria-hidden="true">
    <svg viewBox="0 0 32 32"><circle class="trk" cx="16" cy="16" r="12"/><circle class="arc" cx="16" cy="16" r="12"/><path class="chk" d="M10.5 16.5l3.8 3.8 7.4-8"/></svg>
    <span>Tira per aggiornare</span>
  </div>

  <div class="app">
    <section class="hero" id="hero">
      <div class="hero-top">
        <p class="day" id="day">…</p>
        <button class="icon-btn" id="openSettings" aria-label="Personalizza grafica">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-1 2-2 0-1.5-1.3-1.8-1.3-3 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4C21 6.4 17 3 12 3Z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10" cy="7" r="1.2" fill="currentColor"/><circle cx="15" cy="7" r="1.2" fill="currentColor"/></svg>
        </button>
      </div>

      <div class="wheel-wrap">
        <div class="glow" aria-hidden="true"></div>
        <svg class="wheel" id="wheel" viewBox="-160 -160 320 320" aria-hidden="true"></svg>
        <div class="title">
          <h1 id="signName">&nbsp;</h1>
          <p id="signRange">&nbsp;</p>
        </div>
      </div>
      <div class="facts" id="facts"></div>
    </section>

    <nav class="signs" id="signs" aria-label="Scegli il segno"></nav>

    <div class="periods" id="periods" role="tablist" aria-label="Periodo dell'oroscopo"></div>

    <main id="main" aria-live="polite">
      <div class="state">Sto leggendo le stelle…</div>
    </main>

    <footer class="foot" id="foot"></footer>
  </div>

  <!-- Pannello personalizzazione -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="sheet" id="sheet" aria-hidden="true" aria-label="Personalizza">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2>Personalizza</h2>
      <button class="icon-btn" id="closeSettings" aria-label="Chiudi">✕</button>
    </div>

    <section class="opt">
      <h3>Tema</h3>
      <div class="presets" id="presets"></div>
    </section>

    <section class="opt">
      <h3>Colori</h3>
      <div class="colors" id="colors"></div>
    </section>

    <section class="opt">
      <h3>Caratteri</h3>
      <div class="fonts" id="fonts"></div>
    </section>

    <section class="opt">
      <h3>Valutazioni</h3>
      <div class="seg" id="ratingStyle"></div>
    </section>

    <section class="opt">
      <h3>Barra della giornata</h3>
      <div class="seg three" id="meterStyle"></div>
    </section>

    <section class="opt">
      <label class="range"><span>Dimensione testo</span><input type="range" id="textScale" min="0.85" max="1.25" step="0.05"></label>
      <label class="range"><span>Arrotondamento</span><input type="range" id="radius" min="0" max="36" step="2"></label>
      <label class="range"><span>Cielo stellato</span><input type="range" id="stars" min="0" max="1" step="0.1"></label>
    </section>

    <section class="opt actions">
      <button class="btn ghost" id="exportTheme">Copia tema</button>
      <button class="btn ghost" id="importTheme">Incolla tema</button>
      <button class="btn" id="resetTheme">Ripristina</button>
    </section>
  </aside>

  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
